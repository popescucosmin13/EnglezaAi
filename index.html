  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fără reload la controllerchange, un service worker nou preia controlul în fundal, dar
      // pagina deja deschisă rămâne pe codul vechi din memorie — exact simptomul „trebuie să
      // șterg și să pun din nou PWA-ul". Un singur reload automat rezolvă asta definitiv.
      if ('serviceWorker' in navigator) {
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // PWA-ul instalat nu navighează des — verificăm activ la fiecare revenire în prim-plan,
            // nu doar la verificarea pasivă/rară a browserului.
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update().catch(() => {});
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
